# Non-obvious cross-service dependencies.
# Paths match how git reports them in the Arena monorepo (arena/bcs-arena/ prefix).

patterns:
  - match: "arena/bcs-arena/proto/clubs/**"
    revalidate: [api-gateway, club-finance, referrals, club-self-registration]
  - match: "arena/bcs-arena/proto/auth/**"
    revalidate: [api-gateway, fan-registration]
  - match: "arena/bcs-arena/proto/referrals/**"
    revalidate: [api-gateway, agents, club-finance]
  - match: "arena/bcs-arena/services/auth-service/internal/jwt/**"
    revalidate: [fan-registration, club-self-registration, wallet]
  - match: "arena/bcs-arena/services/referrals/internal/event/**"
    revalidate: [agents, club-finance]
  - match: "arena/bcs-arena/services/api-gateway/internal/service_v2/**"
    revalidate: [api-gateway, overview]
