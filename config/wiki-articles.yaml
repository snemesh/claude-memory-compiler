# Maps each wiki article slug to its priority tier and source-file globs.
# Paths are repo-relative — for the Arena monorepo, git reports paths with
# the `arena/bcs-arena/` prefix.

articles:
  # ── Models (P1) ──────────────────────────────────────────────────
  - slug: fan-entity
    priority: MODELS
    sources:
      - "arena/bcs-arena/services/user-profiles/internal/entity/**/*.go"
      - "arena/bcs-arena/proto/user-profiles/**/*.proto"
  - slug: club-entity
    priority: MODELS
    sources:
      - "arena/bcs-arena/services/clubs/internal/entity/**/*.go"
      - "arena/bcs-arena/proto/clubs/**/*.proto"
  - slug: campaign
    priority: MODELS
    sources: ["arena/bcs-arena/services/content/internal/campaign/**/*.go"]
  - slug: ad-task
    priority: MODELS
    sources: ["arena/bcs-arena/services/content/internal/adtask/**/*.go"]
  - slug: geo-tiers
    priority: MODELS
    sources: ["arena/bcs-arena/services/content/internal/geo/**/*.go"]

  # ── Services (P2) ────────────────────────────────────────────────
  - slug: api-gateway
    priority: SERVICES
    sources: ["arena/bcs-arena/services/api-gateway/**/*.go"]
  - slug: auth-service
    priority: SERVICES
    sources: ["arena/bcs-arena/services/auth-service/**/*.go"]
  - slug: user-profiles
    priority: SERVICES
    sources: ["arena/bcs-arena/services/user-profiles/**/*.go"]
  - slug: clubs
    priority: SERVICES
    sources: ["arena/bcs-arena/services/clubs/**/*.go"]
  - slug: agents
    priority: SERVICES
    sources: ["arena/bcs-arena/services/agents/**/*.go"]
  - slug: club-finance
    priority: SERVICES
    sources: ["arena/bcs-arena/services/club-finance/**/*.go"]
  - slug: referrals
    priority: SERVICES
    sources: ["arena/bcs-arena/services/referrals/**/*.go"]

  # ── Features (P3) ────────────────────────────────────────────────
  - slug: fan-registration
    priority: FEATURES
    sources:
      - "arena/bcs-arena/services/auth-service/internal/register/**/*.go"
      - "arena/bcs-arena/services/user-profiles/internal/create/**/*.go"
  - slug: club-self-registration
    priority: FEATURES
    sources:
      - "arena/bcs-arena/services/clubs/internal/register/**/*.go"
      - "arena/bcs-arena/services/clubs/internal/moderation/**/*.go"
  - slug: wallet
    priority: FEATURES
    sources: ["arena/bcs-arena/services/*/internal/wallet/**/*.go"]

  # ── Integrations (P4) ────────────────────────────────────────────
  - slug: turnkey
    priority: INTEGRATIONS
    sources: ["arena/bcs-arena/services/*/internal/turnkey/**/*.go"]
  - slug: atleta-network
    priority: INTEGRATIONS
    sources: ["arena/bcs-arena/services/*/internal/atleta/**/*.go"]

  # ── Overview (P5) ────────────────────────────────────────────────
  - slug: overview
    priority: OVERVIEW
    sources: ["arena/bcs-arena/**/*.go", "arena/bcs-arena/**/*.proto"]
